<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a1322">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Map">
<title>Map</title>
<style id="lockcss">
html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 40%,#16284a,#060b17);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#lock{position:fixed;inset:0;display:grid;place-items:center;padding:20px}
#lock form{width:min(340px,100%);text-align:center}
#lock .mark{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#f3d488,#c8952f);box-shadow:0 4px 18px rgba(0,0,0,.45)}
#lock h1{font:600 26px/1.1 Georgia,"Times New Roman",serif;margin:0 0 6px}
#lock p{margin:0 0 18px;color:#aebbd4;font-size:14.5px;min-height:1.3em}
#lock input{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:14px;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font-size:17px;text-align:center;outline:none}
#lock input:focus{border-color:#e0b356}
#lock button{width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:#e0b356;color:#2b1f05;font-weight:650;font-size:16px;cursor:pointer}
#lock button:disabled{opacity:.6}
#lock .bad{color:#ff9d8f}
</style>
</head>
<body>
<div id="lock"><form id="lf" autocomplete="off">
  <div class="mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3a2a08" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg></div>
  <h1>Private map</h1>
  <p id="lm">Type the code to open it.</p>
  <input id="lc" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Code" aria-label="Code">
  <button id="lb">Open</button>
</form></div>
<script>
(function(){
  // installing: keep the browser's offer so the app can show its own Install button, and switch on offline support
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.mapInstall=e;window.dispatchEvent(new Event('mapinstall'))});
  window.addEventListener('appinstalled',function(){window.mapInstall=null;window.dispatchEvent(new Event('mapinstall'))});
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  var KC='mfmap.code', KL='mfmap.link', $=function(i){return document.getElementById(i)};
  var norm=function(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')};
  var say=function(t,bad){var m=$('lm');m.textContent=t;m.className=bad?'bad':''};
  var script=function(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('load'))};document.head.appendChild(s)})};
  var unb64=function(s){s=s.replace(/-/g,'+').replace(/_/g,'/');var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};
  var open=function(key,box){return crypto.subtle.decrypt({name:'AES-GCM',iv:box.slice(0,12)},key,box.slice(12))};
  var sealed=null;
  // kind 'code': what a person types.  kind 'link': the long key carried by the private link.
  async function unlock(secret,kind,quiet){
    if(kind==='code') secret=norm(secret); if(!secret) return false;
    if(!window.crypto||!crypto.subtle||!window.DecompressionStream){say('This browser is too old to open the map. Try Chrome or Safari, up to date.',true);return false}
    $('lb').disabled=true; if(!quiet) say('Opening...');
    try{
      if(!sealed) sealed=new Uint8Array(await (await fetch('app.bin?v=mwhtukor')).arrayBuffer());
      var ck;
      try{
        var kek;
        if(kind==='code'){
          var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(secret),'PBKDF2',false,['deriveKey']);
          kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:sealed.slice(4,20),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
          ck=await open(kek,sealed.slice(20,80));
        }else{
          kek=await crypto.subtle.importKey('raw',unb64(secret),{name:'AES-GCM'},false,['decrypt']);
          ck=await open(kek,sealed.slice(80,140));
        }
      }catch(e){
        try{localStorage.removeItem(kind==='code'?KC:KL)}catch(x){}
        $('lb').disabled=false;
        if(kind==='link'){ var sc=null; try{sc=localStorage.getItem(KC)}catch(x){} if(sc) return unlock(sc,'code',true); say('That link no longer works. Type the code instead.',true); return false; }
        say(quiet?'Type the code to open it.':'That code is not right. Try again.',!quiet); return false;
      }
      var zipped=await open(await crypto.subtle.importKey('raw',ck,{name:'AES-GCM'},false,['decrypt']),sealed.slice(140));
      var app=JSON.parse(await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
      try{localStorage.setItem(kind==='code'?KC:KL,secret)}catch(x){}
      say('Loading the map...');
      await script('data/world.js?v=e9cfee21c4'); await script('data/relief.js?v=936e27953f');
      document.title=app.title; $('lockcss').remove();
      var st=document.createElement('style'); st.textContent=app.css; document.head.appendChild(st);
      document.body.innerHTML=app.body;
      var s=document.createElement('script'); s.textContent=app.js; document.body.appendChild(s);
      return true;
    }catch(e){ say('Could not load the map. Check the internet and try again.',true); $('lb').disabled=false; return false; }
  }
  $('lf').addEventListener('submit',function(e){e.preventDefault();unlock($('lc').value,'code')});
  var ml=/[#&]l=([A-Za-z0-9_-]+)/.exec(location.hash), mk=/[#&]k=([^&]+)/.exec(location.hash), sc=null, sl=null;
  try{sc=localStorage.getItem(KC);sl=localStorage.getItem(KL)}catch(x){}
  if(ml||mk){ try{history.replaceState(null,'',location.pathname+location.search)}catch(x){} } // take the secret out of the address bar straight away
  if(ml) unlock(ml[1],'link');
  else if(mk) unlock(decodeURIComponent(mk[1]),'code');
  else if(sl) unlock(sl,'link',true);
  else if(sc) unlock(sc,'code',true);
  else $('lc').focus();
})();
</script>
</body>
</html>
