<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Max &amp; Ari</title>
<meta name="description" content="The family calendar for Max and Ari">
<meta name="theme-color" content="#F7F2E9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F2E9; --card: #FFFFFF; --card2: #F2ECE1; --ink: #262625; --muted: #767067; --line: #E7DFD1;
  --brass: #A8834A; --brass-lt: #D9BE8C; --brass-dk: #7A5E32; --face: #262625;
  --max: #2F6F73; --ari: #C8644B; --both: #A8834A; --family: #7C6A9E; --dad: #3F5E86; --mum: #A34E6E; --helper: #5F7A6A;
  --ok: #3F7D5A; --warn: #B4452A; --warn-bg: #FBEDE6;
  --r: 22px; --shadow: 0 1px 2px rgba(60, 45, 20, .05), 0 10px 28px rgba(60, 45, 20, .06);
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141514; --card: #1D1F1E; --card2: #252826; --ink: #F1ECE2; --muted: #A39D92; --line: #2E322F; --face: #F1ECE2;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); --warn-bg: #3A1F14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141514; --card: #1D1F1E; --card2: #252826; --ink: #F1ECE2; --muted: #A39D92; --line: #2E322F; --face: #F1ECE2;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); --warn-bg: #3A1F14; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; }
body { min-height: 100vh; overscroll-behavior-y: contain; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: var(--brass-dk); }
svg { flex: none; }
.ic { stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.ic.star { fill: var(--brass); stroke: var(--brass); stroke-width: 1.2; }
#app { max-width: 600px; margin: 0 auto; padding: 0 0 calc(96px + var(--safe-b)); min-height: 100vh; }
.muted { color: var(--muted); }
.hide { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.serif { font-family: var(--serif); font-weight: 600; }

/* ------------------------------------------------ header */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; padding: calc(8px + var(--safe-t)) 14px 8px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.top .mark { width: 50px; height: auto; flex: none; }
.top .wm { flex: none; color: var(--ink); margin-top: 2px; }
.top .sp { flex: 1; }
.sync { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
.sync.busy { background: var(--brass); animation: pulse 1s infinite; }
.sync.off { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); }
@keyframes pulse { 50% { opacity: .35; } }
.me { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 15px; }

/* ------------------------------------------------ stories row */
.stories { display: flex; gap: 16px; padding: 6px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.stories::-webkit-scrollbar { display: none; }
.story { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); min-width: 66px; }
.story .ring { width: 66px; height: 66px; border-radius: 50%; padding: 2.5px; background: var(--line); transition: transform .15s; }
.story.on .ring { background: conic-gradient(from 200deg, var(--c1), var(--c2), var(--c1)); }
.story.on { color: var(--ink); }
.story:active .ring { transform: scale(.94); }
.story .in { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg); display: grid; place-items: center; font-family: var(--serif); font-weight: 600; font-size: 28px; color: #fff; background: var(--c1); position: relative; }
.story .badge { position: absolute; right: -4px; bottom: -2px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--ink); color: var(--bg); font: 700 12px var(--font); display: grid; place-items: center; border: 2px solid var(--bg); }

/* ------------------------------------------------ cards and type */
h1.hello { font-family: var(--serif); font-size: 34px; line-height: 1.05; margin: 16px 16px 2px; letter-spacing: -.01em; font-weight: 600; }
.sub { margin: 0 16px 12px; color: var(--muted); font-weight: 500; }
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); margin: 12px 16px; padding: 16px; border: 1px solid var(--line); }
.card.flat { box-shadow: none; }
.card h3, .sec { margin: 0 0 10px; font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-dk); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sec { margin: 22px 16px 8px; }
.sec .r, .card h3 .r { margin-left: auto; letter-spacing: 0; text-transform: none; font-size: 13px; color: var(--muted); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; color: #fff; background: var(--c, var(--brass)); white-space: nowrap; letter-spacing: .01em; }
.pill.soft { background: color-mix(in srgb, var(--c, var(--brass)) 13%, transparent); color: var(--c, var(--brass)); }
.tile { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: color-mix(in srgb, var(--tc) 14%, var(--card)); color: var(--tc); flex: none; }
.tile.big { width: 46px; height: 46px; border-radius: 15px; }
.tile .ic { vertical-align: 0; stroke-width: 1.9; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; min-height: 40px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--card); font-weight: 600; font-size: 14.5px; white-space: nowrap; transition: all .12s; }
.chip .ic { vertical-align: 0; }
.chip.on { border-color: var(--c, var(--ink)); background: var(--c, var(--ink)); color: #fff; }
.chip .x { opacity: .7; }
.chip.iconchip { width: 46px; height: 46px; padding: 0; justify-content: center; color: var(--brass-dk); }
.chip.iconchip.on { color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 2px 18px; }
.chips.scroll::-webkit-scrollbar { display: none; }
a.btn { text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 99px; font-weight: 600; font-size: 15px; background: var(--card2); color: var(--ink); border: 1px solid var(--line); }
.btn.primary { background: var(--ink); color: var(--bg); border: 0; }
.btn.gold { background: var(--brass); color: #fff; border: 0; }
.btn.danger { color: var(--warn); }
.btn.block { width: 100%; }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn .ic { vertical-align: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); }
.empty b { display: block; font-family: var(--serif); font-size: 24px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.pbar { display: block; height: 6px; border-radius: 6px; background: var(--card2); overflow: hidden; margin: 6px 0; }
.pbar i { display: block; height: 100%; background: var(--ok); border-radius: 6px; transition: width .3s; }
.kdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }

/* ------------------------------------------------ heat map */
.heat { display: grid; grid-template-columns: 46px repeat(7, 1fr); gap: 5px; align-items: center; }
.heat .lab { font-size: 11.5px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.heat .dh { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1.1; padding: 4px 0; border-radius: 10px; }
.heat .dh b { display: block; font-family: var(--serif); font-size: 21px; color: var(--ink); font-weight: 600; }
.heat .dh.today b { color: var(--brass); }
.heat .dh.sel { background: var(--ink); color: var(--brass-lt); }
.heat .dh.sel b { color: var(--bg); }
.heat .c { aspect-ratio: 1.25; border-radius: 9px; background: color-mix(in srgb, var(--hc) calc(var(--lv) * 22%), var(--card2)); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink); position: relative; transition: transform .12s; }
.heat .c.big { aspect-ratio: .95; font-size: 15px; }
.heat .c[data-lv="3"], .heat .c[data-lv="4"] { color: #fff; }
.heat .c.clash::after { content: ''; position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px var(--card); }
.heat .c.selc { outline: 2px solid var(--ink); outline-offset: 1px; }
.heat button:active { transform: scale(.93); }
.heat-key { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); margin-top: 10px; font-weight: 600; }
.heat-key i { width: 16px; height: 12px; border-radius: 4px; background: color-mix(in srgb, var(--brass) calc(var(--lv) * 22%), var(--card2)); }

/* ------------------------------------------------ away banner */
.awaybar, .acard { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--brass-lt); border-radius: 20px; padding: 12px 14px; margin: 10px 16px; width: calc(100% - 32px); text-align: left; box-shadow: var(--shadow); }
.awaybar b, .acard b { font-family: var(--serif); font-size: 20px; font-weight: 600; }
.awaybar small, .acard small { display: block; color: var(--muted); font-size: 13px; font-weight: 500; }
.acard .pbar { margin: 8px 0 4px; }

/* ------------------------------------------------ the day */
.dayhead { display: flex; align-items: center; gap: 6px; margin: 20px 16px 6px; }
.dayhead h2 { margin: 0; font-family: var(--serif); font-size: 30px; font-weight: 600; letter-spacing: -.01em; flex: 1; line-height: 1.05; }
.dayhead h2 small { display: block; font: 600 13px var(--font); color: var(--muted); letter-spacing: 0; margin-top: 3px; }
.iconbtn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); flex: none; }
.iconbtn.plain { background: none; border: 0; width: 38px; height: 38px; color: var(--muted); }
.iconbtn .ic { vertical-align: 0; }
.daysum { display: flex; align-items: center; gap: 8px; margin: 4px 16px 2px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.daysum .pbar { flex: 1; margin: 0; }
.part { margin: 16px 18px 4px; font: italic 600 19px var(--serif); color: var(--brass-dk); }
.part.small { margin: 12px 0 2px; font-size: 16px; }
.jobrow { margin: 0 16px; padding: 0 10px; background: var(--card); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.jobrow:not(.jobrow + .jobrow) { border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; margin-top: 8px; }
.jobrow:not(:has(+ .jobrow)) { border-bottom: 1px solid var(--line); border-radius: 0 0 16px 16px; margin-bottom: 8px; }
.jobrow:not(.jobrow + .jobrow):not(:has(+ .jobrow)) { border-radius: 16px; }
.jobrow + .jobrow { border-top: 1px solid var(--line); }
.ev { display: flex; gap: 12px; align-items: stretch; background: var(--card); border-radius: 18px; margin: 8px 16px; padding: 12px 14px 12px 12px; border: 1px solid var(--line); box-shadow: var(--shadow); width: calc(100% - 32px); text-align: left; position: relative; }
.ev .t { width: 56px; flex: none; font-weight: 700; font-size: 15px; line-height: 1.15; padding-top: 5px; }
.ev .t small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.ev .bar { width: 4px; border-radius: 4px; background: var(--c); flex: none; }
.ev .bar.both { background: linear-gradient(var(--max) 50%, var(--ari) 50%); }
.ev .body { flex: 1; min-width: 0; }
.ev .ttl { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16.5px; line-height: 1.25; }
.ev .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; font-size: 13px; color: var(--muted); }
.ev .meta .m { display: inline-flex; align-items: center; gap: 4px; }
.ev .meta .m .ic { vertical-align: 0; }
.ev.past { opacity: .5; box-shadow: none; }
.tag { font-size: 12px; font-weight: 700; color: var(--warn); }
.drv { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 12.5px; color: var(--c); background: color-mix(in srgb, var(--c) 11%, transparent); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.drv .ic { vertical-align: 0; }
.drv.none { --c: var(--warn); }

/* next up */
.next { background: #262625; color: #EFE7D8; border-radius: 26px; margin: 12px 16px; padding: 18px; position: relative; overflow: hidden; box-shadow: 0 12px 30px rgba(38, 38, 37, .22); }
.next::after { content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; border: 1px solid rgba(217, 190, 140, .35); pointer-events: none; }
.next .lbl { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--brass-lt); font-weight: 700; }
.next .big { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 28px; font-weight: 600; line-height: 1.1; margin: 8px 0 4px; color: #fff; }
.next .big .tile { background: rgba(255, 255, 255, .1); color: var(--brass-lt); }
.next .cd { font-size: 15px; font-weight: 600; color: var(--brass-lt); }
.next .leave { display: inline-flex; align-items: center; gap: 7px; margin-top: 12px; padding: 8px 14px; border-radius: 99px; background: var(--brass); color: #fff; font-weight: 700; font-size: 14.5px; }
.next .leave .ic { vertical-align: 0; }
.next .leave.late { background: var(--warn); }
.next .nnote { margin-top: 10px; font-size: 14px; color: #D8CFBF; }
.next .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.next .acts .btn { background: rgba(255, 255, 255, .08); color: #EFE7D8; border-color: rgba(217, 190, 140, .3); }
.next .packs { margin-top: 10px; }

/* checkboxes: big, satisfying */
.tick { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 2px; width: 100%; text-align: left; border-bottom: 1px solid var(--line); flex: 1; min-width: 0; }
.row > .tick { border-bottom: 0; }
.sheet .row:has(> .tick) { border-bottom: 1px solid var(--line); }
.tick .bx { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--brass); display: grid; place-items: center; flex: none; transition: all .15s; background: var(--card); }
.tick .bx .ic { width: 17px; height: 17px; stroke: #fff; stroke-width: 3; opacity: 0; transform: scale(.5); transition: all .18s; vertical-align: 0; }
.tick.done .bx { background: var(--ok); border-color: var(--ok); }
.tick.done .bx .ic { opacity: 1; transform: none; }
.tick.done .tx { text-decoration: line-through; color: var(--muted); }
.tick .ii { width: 20px; flex: none; color: var(--muted); display: grid; place-items: center; }
.tick .ii:empty { display: none; }
.tick .ii .ic { vertical-align: 0; }
.tick.done .ii { opacity: .5; }
.tick .tx { flex: 1; min-width: 0; font-weight: 600; font-size: 15.5px; }
.tick .tx small { display: block; font-weight: 500; font-size: 12.5px; color: var(--muted); text-decoration: none; }
.tick .who { font-size: 11.5px; color: var(--ok); font-weight: 700; white-space: nowrap; }
.next .tick { border-color: rgba(217, 190, 140, .18); min-height: 44px; }
.next .tick .bx { background: transparent; border-color: var(--brass-lt); }
.next .tick.done .bx { background: var(--ok); border-color: var(--ok); }
.next .tick .tx { color: #fff; }
.pop { animation: pop .35s; }
@keyframes pop { 40% { transform: scale(1.25); } }

.alert { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-bg); color: var(--warn); border-radius: 16px; padding: 12px 14px; margin: 8px 16px; font-weight: 600; font-size: 14.5px; border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); width: calc(100% - 32px); text-align: left; }
.alert .ic { vertical-align: 0; margin-top: 1px; }
.news { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--brass-lt); border-radius: 18px; padding: 12px 14px; margin: 10px 16px; width: calc(100% - 32px); text-align: left; font-weight: 600; font-size: 14.5px; }
.news .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--brass); flex: none; animation: pulse 1.6s infinite; }

/* ------------------------------------------------ calendar */
.seg { display: flex; background: var(--card2); border-radius: 99px; padding: 4px; margin: 12px 16px; border: 1px solid var(--line); }
.seg button { flex: 1; min-height: 40px; border-radius: 99px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.wk { margin: 6px 12px; }
.wk .hd { display: grid; grid-template-columns: 50px 1fr 1fr; gap: 6px; position: sticky; top: calc(59px + var(--safe-t)); background: var(--bg); z-index: 5; padding: 6px 0; }
.wk .hd div { text-align: center; font-family: var(--serif); font-weight: 600; font-size: 19px; padding: 6px; border-radius: 14px; color: #fff; }
.wk .dayrow { display: grid; grid-template-columns: 50px 1fr 1fr; gap: 6px; margin-bottom: 6px; }
.wk .dl { text-align: center; padding-top: 8px; font-size: 11.5px; font-weight: 700; color: var(--muted); line-height: 1.1; }
.wk .dl b { display: block; font-family: var(--serif); font-size: 24px; font-weight: 600; color: var(--ink); }
.wk .dl.today b { color: #fff; background: var(--brass); border-radius: 50%; width: 34px; height: 34px; line-height: 34px; margin: 2px auto 0; font-size: 20px; }
.wk .cell { background: var(--card); border: 1px solid var(--line); border-radius: 14px; min-height: 58px; padding: 5px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
.wk .span { grid-column: 2 / 4; }
.wk .it { display: block; border-radius: 10px; padding: 5px 7px; font-size: 12.5px; font-weight: 700; line-height: 1.25; background: color-mix(in srgb, var(--c) 11%, var(--card)); border-left: 3px solid var(--c); width: 100%; text-align: left; }
.wk .it small { display: block; font-weight: 600; color: var(--muted); font-size: 11.5px; }
.wk .it .ic { width: 13px; height: 13px; margin-right: 4px; vertical-align: -2px; color: var(--c); }
.wk .it .ic.star { margin: 0 0 0 3px; }
.wk .add { flex: 1; min-height: 20px; border-radius: 8px; }
.wk .add:active { background: var(--card2); }
.month { background: var(--card); border: 1px solid var(--line); border-radius: 26px; margin: 10px 16px; padding: 10px 10px 12px; box-shadow: var(--shadow); }
.month .mh { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 6px; }
.month .mh h2 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 30px; }
.month .mh h2 span { color: var(--brass); font-weight: 500; }
.month .wd, .month .grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
.month .wd div { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--muted); padding: 6px 0; }
.month .grid button { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 14px; font-weight: 600; font-size: 15px; position: relative; }
.month .grid button.out { opacity: .3; }
.month .grid span.n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-size: 19px; }
.month .grid button.today span.n { border: 1.5px solid var(--brass); color: var(--brass-dk); }
.month .grid button.sel span.n { background: var(--ink); color: var(--bg); }
.month .grid button[data-lv="3"]:not(.sel) span.n, .month .grid button[data-lv="4"]:not(.sel) span.n { background: color-mix(in srgb, var(--brass) 16%, transparent); }
.month .grid .dots { display: flex; gap: 3px; height: 5px; }
.month .grid .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--c); }

/* ------------------------------------------------ lists */
.lgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 16px; }
.lcard { background: var(--card); border-radius: var(--r); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 14px; text-align: left; min-height: 140px; display: flex; flex-direction: column; gap: 6px; }
.lcard .nm { font-family: var(--serif); font-weight: 600; font-size: 21px; line-height: 1.1; margin-top: 4px; }
.lcard .sm { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.lcard .pbar { margin-top: auto; }
.lcard.new { border: 1.5px dashed var(--brass-lt); box-shadow: none; background: transparent; align-items: center; justify-content: center; text-align: center; color: var(--brass-dk); font-weight: 700; }
.hero-away { display: flex; gap: 14px; align-items: center; margin: 12px 16px; padding: 16px; border-radius: 22px; background: var(--card2); border: 1px dashed var(--brass-lt); width: calc(100% - 32px); text-align: left; }
.hero-away b { display: block; font-family: var(--serif); font-size: 21px; font-weight: 600; }
.hero-away span { font-size: 13.5px; color: var(--muted); }
.lday { margin: 20px 0 2px; display: flex; align-items: baseline; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--brass-lt); }
.lday span:first-child { font-family: var(--serif); font-size: 24px; font-weight: 600; }
.lday em { font-style: normal; color: var(--muted); font-size: 13px; font-weight: 600; }
.lday .r { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 700; }
.lday.now span:first-child { color: var(--brass-dk); }
.lday.past { opacity: .6; }
.evrow { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.evrow .tick { flex: none; width: auto; min-height: 0; padding: 4px 2px; border: 0; }
.evbody { flex: 1; min-width: 0; text-align: left; background: color-mix(in srgb, var(--brass) 7%, var(--card)); border-radius: 12px; padding: 8px 10px; }
.evbody .tm { font-weight: 700; font-size: 14px; }
.evbody b { font-size: 15.5px; }
.evbody .tile { width: 24px; height: 24px; border-radius: 8px; }
.evbody .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.evbody .meta .m { display: inline-flex; gap: 4px; align-items: center; }
.evbody .nt { display: block; font-size: 13px; margin-top: 5px; color: var(--ink); }
.evbody .who { display: block; font-size: 12px; font-weight: 700; color: var(--ok); margin-top: 4px; }
.additem { display: flex; gap: 8px; position: sticky; bottom: calc(-24px - var(--safe-b)); background: var(--card); padding: 10px 0 calc(10px + var(--safe-b)); margin-top: 8px; border-top: 1px solid var(--line); z-index: 2; }
.sugs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.sugs button { font-size: 13px; padding: 6px 12px; border-radius: 99px; background: var(--card2); border: 1px dashed var(--brass-lt); font-weight: 600; }

/* ------------------------------------------------ forms */
.f { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
.in { width: 100%; min-height: 50px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); padding: 12px 14px; font-size: 16.5px; outline: none; transition: border-color .12s; }
.in:focus { border-color: var(--brass); }
textarea.in { min-height: 80px; resize: vertical; }
.in.big { font-size: 20px; font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.three { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.three > :first-child { grid-column: 1 / 3; }
.three .in, .two .in { min-width: 0; }
.quick { background: var(--card2); border-radius: 18px; padding: 12px 14px; border: 1.5px solid var(--brass-lt); margin-top: 6px; }
.quick input { width: 100%; background: transparent; border: 0; outline: none; font-size: 17px; font-weight: 600; padding: 4px 0; }
.quick input::placeholder { color: var(--muted); font-weight: 500; }
.quick .hint { font-size: 12px; color: var(--brass-dk); font-weight: 700; letter-spacing: .04em; }
.sugbox { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-top: 6px; overflow: hidden; box-shadow: var(--shadow); }
.sugbox button { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
.sugbox button:last-child { border-bottom: 0; }
.sugbox small { color: var(--muted); font-weight: 500; display: block; font-size: 12.5px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.days .chip { padding: 0; justify-content: center; min-height: 44px; }
.switch { display: flex; align-items: center; gap: 12px; padding: 12px 0; width: 100%; text-align: left; }
.switch .tx { flex: 1; font-weight: 600; }
.switch .tx small { display: block; color: var(--muted); font-weight: 500; font-size: 13px; }
.switch .sw { width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch .sw::after { content: ''; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .15s; }
.switch.on .sw { background: var(--ok); }
.switch.on .sw::after { transform: translateX(20px); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags .chip { min-height: 36px; padding: 6px 12px; }

/* ------------------------------------------------ bottom sheet */
.sheet { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.sheet .scrim { position: absolute; inset: 0; background: rgba(20, 18, 14, .4); opacity: 0; transition: opacity .2s; }
.sheet .panel { position: absolute; left: 0; right: 0; bottom: 0; max-width: 600px; margin: 0 auto; max-height: 94vh; overflow-y: auto; overflow-x: hidden; background: var(--card); border-radius: 28px 28px 0 0; padding: 8px 18px calc(24px + var(--safe-b)); transform: translateY(105%); transition: transform .28s cubic-bezier(.2, .9, .3, 1); overscroll-behavior: contain; }
.sheet.open { pointer-events: auto; }
.sheet.open .scrim { opacity: 1; }
.sheet.open .panel { transform: none; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px; }
.shead { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.shead h2 { flex: 1; margin: 0; font-family: var(--serif); font-size: 28px; font-weight: 600; letter-spacing: -.01em; line-height: 1.1; }
.sfoot { position: sticky; bottom: calc(-24px - var(--safe-b)); background: var(--card); padding: 12px 0 calc(12px + var(--safe-b)); margin-top: 16px; display: flex; gap: 10px; border-top: 1px solid var(--line); }
.choice { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.choice .btn { justify-content: flex-start; min-height: 60px; text-align: left; border-radius: 18px; gap: 14px; }
.choice .btn.sel { border-color: var(--brass); background: color-mix(in srgb, var(--brass) 8%, var(--card)); }
.choice .btn small { display: block; font-weight: 500; font-size: 13px; color: var(--muted); }
.detail .kv { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.detail .kv .k { width: 26px; text-align: center; color: var(--brass-dk); }
.detail .kv .v { flex: 1; font-weight: 600; }
.detail .kv .v small { display: block; color: var(--muted); font-weight: 500; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }

/* ------------------------------------------------ bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around; align-items: center; max-width: 600px; margin: 0 auto; padding: 8px 10px calc(8px + var(--safe-b)); background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.tabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); min-width: 60px; min-height: 48px; justify-content: center; }
.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button.on { color: var(--ink); }
.tabs button.on svg { stroke-width: 2.3; }
.tabs .fab { width: 58px; height: 58px; min-width: 58px; border-radius: 50%; background: var(--ink); color: var(--bg); margin-top: -24px; box-shadow: 0 8px 20px rgba(38, 38, 37, .28); border: 3px solid var(--bg); }
.tabs .fab svg { width: 26px; height: 26px; stroke-width: 2.4; }
.tabs .fab:active { transform: scale(.94); }

.toast { position: fixed; left: 50%; bottom: calc(104px + var(--safe-b)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 16px; font-weight: 600; font-size: 14.5px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 60; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast button { color: var(--brass-lt); font-weight: 800; margin-left: 10px; pointer-events: auto; }

/* ------------------------------------------------ connect / welcome */
body.welcome-on #app { padding-bottom: 0; }
.welcome { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 22px; text-align: center; background: var(--bg); color: var(--ink); }
.welcome .mark { width: 200px; height: auto; margin-bottom: 6px; }
.welcome h1 { margin: 8px 0 4px; font-family: var(--serif); font-weight: 600; font-size: 30px; }
.welcome p { color: var(--muted); max-width: 340px; margin: 6px auto; }
.welcome form { width: 100%; max-width: 360px; margin-top: 18px; }
.welcome .in { text-align: center; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 22px; letter-spacing: .1em; }
.welcome .err { color: var(--warn); min-height: 22px; font-weight: 600; margin: 8px 0; }
.welcome .who { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 360px; margin-top: 20px; }
.welcome .who button { padding: 22px 10px; border-radius: 24px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); font-family: var(--serif); font-weight: 600; font-size: 24px; }
.welcome .who button span { display: grid; place-items: center; width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 10px; font-size: 26px; color: #fff; }
.install { position: fixed; left: 12px; right: 12px; bottom: calc(100px + var(--safe-b)); z-index: 40; max-width: 576px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 22px; background: var(--card); border: 1px solid var(--brass-lt); box-shadow: 0 12px 30px rgba(0, 0, 0, .18); animation: up .35s; }
.install img { width: 52px; height: 52px; border-radius: 14px; }
.install b { display: block; font-family: var(--serif); font-size: 20px; }
.install span { font-size: 13px; color: var(--muted); }
.install .x { width: 36px; height: 36px; display: grid; place-items: center; color: var(--muted); }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.feed .it { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.feed .it .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; flex: none; font-size: 13px; }
.feed .it small { display: block; color: var(--muted); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

// "8am school lunches" -> time 08:00, text "School lunches"
function splitTime(text) {
  var m = /^\s*(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?\s+(.+)$/i.exec(text) || /^(.+?)\s+(?:at\s+)?(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)\s*$/i.exec(text);
  if (!m) return { text: text.trim(), time: '' };
  var h, mm, ap, rest;
  if (/^\s*\d/.test(text)) { h = +m[1]; mm = +(m[2] || 0); ap = m[3]; rest = m[4]; if (!ap && !m[2]) return { text: text.trim(), time: '' }; }
  else { rest = m[1]; h = +m[2]; mm = +(m[3] || 0); ap = m[4]; }
  if (ap && /pm/i.test(ap) && h < 12) h += 12; if (ap && /am/i.test(ap) && h === 12) h = 0;
  if (h > 23 || mm > 59) return { text: text.trim(), time: '' };
  rest = rest.trim();
  return { text: rest.charAt(0).toUpperCase() + rest.slice(1), time: MA.pad(h) + ':' + MA.pad(mm) };
}

  var mk = function (d) { return { id: MA.uid('i'), text: p.text, time: p.time, day: d || '', kid: '', important: false, doneOn: '' }; };
  l.items = l.items || [];
  if (day === '*') { for (var d = l.from; d <= l.to; d = MA.addDays(d, 1)) l.items.push(mk(d)); }
  else l.items.push(mk(day));

  var ni = $('#newItem'); if (ni) ni.focus();
}

  var l = { id: MA.uid('l'), title: pName(a.away) + ' away', kind: 'away', away: a.away, for: other(a.away), from: from, to: to, icon: 'suitcase', items: [], created: Date.now() };
  var prev = lastAway();
  if (a.copy && prev) {
    // same weekday in the new dates gets last time's jobs; undated ones come across as they were
    (prev.items || []).forEach(function (it) {
      var copy = function (d) { return { id: MA.uid('i'), text: it.text, time: it.time || '', after: it.after || '', day: d, kid: it.kid || '', important: !!it.important, doneOn: '' }; };
      if (!it.day) { l.items.push(copy('')); return; }
      for (var d = from; d <= to; d = MA.addDays(d, 1)) if (MA.weekday(d) === MA.weekday(it.day)) l.items.push(copy(d));
    });
    var seen = {}; l.items = l.items.filter(function (it) { var k = it.day + '|' + it.text.toLowerCase(); if (seen[k]) return false; seen[k] = 1; return true; });
  }
  S.data.lists.push(l);
  queue('saveList', { list: l, change: { what: 'Away plan', text: l.title + ' ' + MA.shortDate(from) + ' – ' + MA.shortDate(to) } });
  S.listId = l.id; S.editItem = null; S.lastDay = from;
  openSheet('<div id="listBox"></div>', drawList);
  toast('Plan made. Add jobs at the bottom.');
};

function setPath(obj, path, v) { var p = path.split('.'), o = obj; for (var i = 0; i < p.length - 1; i++) { o[p[i]] = o[p[i]] || {}; o = o[p[i]]; } o[p[p.length - 1]] = v; return obj; }
function getPath(obj, path) { return path.split('.').reduce(function (o, k) { return o ? o[k] : undefined; }, obj); }
function saveSet(patch, msg) { queue('saveSettings', { settings: patch }); if (msg) toast(msg); }
Object.assign(ACT, {

    saveSet(patch, 'Saved');
  },
  toggleSet: function (el) { var k = el.getAttribute('data-k'), v = !getPath(st(), k); saveSet(setPath({}, k, v)); },

  testEmail: function (el) {

    flush().then(function () { return api('testEmail', { to: S.me }); }).then(function (r) { toast('Sent to ' + r.sent); }, function (e) { toast(e.message); }).then(function () { el.disabled = false; });
  },
  gcalMode: function (el) { saveSet({ gcal: { mode: el.getAttribute('data-m') } }, el.getAttribute('data-m') === 'off' ? 'Phone calendar off' : 'The phone calendar fills within 5 minutes'); },

// ------------------------------------------------------------ connect: the password is the last 10 characters of the /exec link
function execUrl(pin) {
  pin = String(pin || '').trim();
  if (/^https:\/\/script\.google\.com\/.+\/exec\/?$/.test(pin)) return pin.replace(/\/$/, '');
  var start = String(CFG.execStart || '').trim().replace(/\/exec\/?$/, '');
  if (!start || !/^https:\/\/script\.google\.com\//.test(start) || !/^[\w-]+$/.test(pin)) return '';
  return start + pin + '/exec';
}
function showConnect(msg) {
  document.body.classList.add('welcome-on');
  $('#tabs').classList.add('hide'); $('#top').classList.add('hide');
  var needFull = !CFG.execStart; // only before the link start is in config.js
  $('#view').innerHTML = '<div class="welcome">' + logoMark(200) +
    '<h1>' + BRAND.word({ height: 64, color: 'currentColor' }) + '</h1><p>The family calendar for the boys.</p>' +
    '<form id="cx" autocomplete="off"><input class="in" id="cxPw" ' + (needFull ? 'placeholder="Link" inputmode="url"' : 'placeholder="PIN"') + ' autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="PIN">' +
    '<p class="err" id="cxErr" role="alert">' + esc(msg || '') + '</p><button class="btn gold block" id="cxGo" type="submit">Open</button>' +
    '<p style="font-size:13px;margin-top:14px">' + (needFull ? 'Paste the link.' : 'Type your PIN. This phone will remember it.') + '</p></form></div>';
  var hashPw = /[#&]k=([^&]+)/.exec(location.hash);
  if (hashPw) { $('#cxPw').value = decodeURIComponent(hashPw[1]); history.replaceState(null, '', location.pathname); }
  $('#cx').addEventListener('submit', function (e) {
    e.preventDefault();
    var pin = $('#cxPw').value.trim(), url = execUrl(pin), err = $('#cxErr'), b = $('#cxGo');
    if (!pin) { err.textContent = needFull ? 'Paste the link first.' : 'Type your PIN first.'; return; }
    if (!url) { err.textContent = needFull ? 'That link does not look right.' : 'That PIN is not right. Check the capitals.'; return; }
    b.disabled = true; b.textContent = 'Opening…'; err.textContent = '';
    var slow = setTimeout(function () { err.textContent = 'The first time can take up to half a minute…'; }, 6000);
    S.conn = { url: url, pw: /^https:/.test(pin) ? '' : pin };
    api('load', { host: location.origin + location.pathname }).then(function (d) {
      clearTimeout(slow);
      S.data = d; S.online = true; saveCache();
      store.set('ma-conn', S.conn);
      render();
    }, function (e) {
      clearTimeout(slow);
      S.conn = null; b.disabled = false; b.textContent = 'Open';
      if (!navigator.onLine) err.textContent = 'No internet just now. Try again when you have signal.';
      else if (e && e.name === 'AbortError') err.textContent = 'Google took too long to answer. Tap Open again.';
      else err.textContent = needFull ? 'That link did not work.' : 'That PIN is not right. Check the capitals.';
    });
  });
  if (hashPw) $('#cxGo').click();
}

// ------------------------------------------------------------ install on the phone

function installable() { return !standalone() && !window.MA_BACKEND_PREVIEW_NO_INSTALL; }

    (window.__maInstall ? '<button class="btn small gold" data-act="install">Install</button>' : '') + '<button class="x" data-act="installLater" aria-label="Not now">' + ic('x', 18) + '</button>';
  document.body.appendChild(el);

ACT.install = function () {

  if (!e) { toast(/samsungbrowser/i.test(navigator.userAgent) ? 'Tap the menu, then “Add page to”, then Home screen.' : 'Tap ⋮ in Chrome, then “Install app” or “Add to Home screen”.'); return; }
  e.prompt();
  (e.userChoice || Promise.resolve({})).then(function (c) { if (c && c.outcome === 'accepted') { var b = $('#installOffer'); if (b) b.remove(); } });
  window.__maInstall = null;
};
ACT.installLater = function () { store.set('ma-install-later', Date.now() + 5 * 864e5); var b = $('#installOffer'); if (b) b.remove(); };

// ------------------------------------------------------------ start
function start() {
  var th = store.get('ma-theme', ''); if (th) document.documentElement.setAttribute('data-theme', th);
  if (window.MA_BACKEND && !S.conn) { S.conn = { url: 'preview', pw: 'preview' }; }
  render();
  if (S.conn) { flush(); reload(true); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.conn) { flush(); reload(true); if (S.tab === 'home' && !S.sheetOpen) softRender(); } });
  window.addEventListener('online', function () { flush(); reload(true); });
  setInterval(function () { if (!document.hidden && S.conn) reload(true); }, 40000);

  setInterval(function () { if (!document.hidden && S.tab === 'home' && !S.sheetOpen && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) { if (S.day < today()) S.day = today(); render(); } }, 60000);
  if ('serviceWorker' in navigator && !window.MA_BACKEND && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () { });
  setTimeout(showInstallOffer, 2500);
}
